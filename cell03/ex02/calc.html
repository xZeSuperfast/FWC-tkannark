<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>It's over 9000</title>
    <link rel="stylesheet" href="calc.css" />
  </head>
  <body>
    <div class="calculator-card">
      <h2>Calculator</h2>
      <form id="calc-form">
        <input type="text" id="left-operand" placeholder="Left number" />

        <select id="operator">
          <option value="+">+</option>
          <option value="-">-</option>
          <option value="*">*</option>
          <option value="/">/</option>
          <option value="%">%</option>
        </select>

        <input type="text" id="right-operand" placeholder="Right number" />

        <input type="submit" id="submit-btn" value="Try me!" />
      </form>
    </div>

    <script src="calc.js"></script>
  </body>
</html>
