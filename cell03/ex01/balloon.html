<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Balloon</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        #balloon {
            width: 200px;
            height: 200px;
            background-color: red;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.3s ease; /* Smooth color transition */
        }
    </style>
</head>
<body>

<div id="balloon"></div>

<script>
    const balloon = document.getElementById('balloon');
    const colors = ['red', 'green', 'blue'];
    
    let currentSize = 200;
    let colorIndex = 0;

    // Helper to update the balloon's appearance
    function updateBalloon() {
        balloon.style.width = currentSize + 'px';
        balloon.style.height = currentSize + 'px';
        balloon.style.backgroundColor = colors[colorIndex];
    }

    // CLICK EVENT: Grow and cycle color forward
    balloon.addEventListener('click', () => {
        currentSize += 10;
        colorIndex = (colorIndex + 1) % colors.length;

        // Check for explosion
        if (currentSize > 420) {
            currentSize = 200;
            colorIndex = 0; // Optional: Reset to red on explode
            alert("POP!"); 
        }
        
        updateBalloon();
    });

    // MOUSELEAVE EVENT: Shrink and cycle color backward
    balloon.addEventListener('mouseleave', () => {
        if (currentSize > 200) {
            currentSize -= 5;
            
            // Reverse color logic
            colorIndex = (colorIndex - 1 + colors.length) % colors.length;
        }
        
        updateBalloon();
    });
</script>

</body>
</html>
