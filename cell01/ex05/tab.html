<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Tab</title>
    <style>
      table {
        width: 100%;
        height: 150px;
        border-collapse: collapse;
      }
      td {
        border: 1px solid black;
        padding: 15px;
        width: 50%;
      }
      .first-cell {
        background-color: #C3B1E1;
      }
      .second-cell {
        background-color: #DBB1E1;
      }
    </style>
  </head>
  <body>

    <table>
      <tr>
        <td class="first-cell">First cell</td>
        <td class="second-cell">Second cell</td>
      </tr>
    </table>

  </body>
</html>
