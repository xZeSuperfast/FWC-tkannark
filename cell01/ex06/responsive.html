<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 06 - Responsive</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .left-cell {
            background-color: #c2c984;
            border: 1px solid black;
            text-align: center;
        }

        .right-cell {
            background-color: #f7c1ad;
            border: 1px solid black;
            text-align: center;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="left-cell">First cell</td>
            <td class="right-cell">Second cell</td>
        </tr>
    </table>

</body>
</html>
