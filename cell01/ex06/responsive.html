<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 06 - Responsive</title>
    <style>
        /* 1. Make the container fill the entire browser window */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevents scrollbars if the table fits perfectly */
        }

        /* 2. Make the table cover the entire web page */
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed; /* Ensures cells stay proportional during resize */
        }

        .left-cell {
            background-color: #c2c984;
            border: 1px solid black;
            text-align: center;
        }

        .right-cell {
            background-color: #f7c1ad;
            border: 1px solid black;
            text-align: center;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="left-cell">First cell</td>
            <td class="right-cell">Second cell</td>
        </tr>
    </table>

</body>
</html>
